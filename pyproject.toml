[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-agent"
version = "0.1.0-alpha"
description = "以交付为核心的 AI 助手，三层记忆架构"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "openai>=1.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
long-agent = "src.entry.cli:app"

[tool.setuptools.packages.find]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
per-file-ignores = { "tests/debug/*" = ["E501", "F401", "F841", "E401", "I001", "W293"] }
