<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header"><h2>🤖 Long Agent</h2></div>
        <div class="sidebar-section">
            <h3>📁 会话</h3>
            <div id="session-list">
                <div class="session-item active"># 会话 1</div>
            </div>
            <button class="new-session-btn" onclick="location.reload()">+ 新建会话</button>
        </div>
        <div class="sidebar-section">
            <h3>📊 状态</h3>
            <div class="status-item"><span class="label">记忆</span><span class="value" id="memory-count">{{ memory_count }} 条</span></div>
            <div class="status-item"><span class="label">人格</span><span class="value">H:{{ personality.H|default(50) }} E:{{ personality.E|default(50) }}</span></div>
            <div class="status-item"><span class="label">状态</span><span class="value status-online">● 运行中</span></div>
        </div>
        <div class="sidebar-section">
            <h3>🗂️ Skill</h3>
            <div id="skill-panel">加载中...</div>
        </div>
        <div class="sidebar-section">
            <h3>🔗 MCP 连接</h3>
            <div id="mcp-panel">加载中...</div>
            <div id="mcp-add-form" style="display:none; margin-top:8px;">
                <input id="mcp-name" placeholder="名称" style="width:100%;margin-bottom:4px;padding:4px;">
                <input id="mcp-url" placeholder="http://localhost:9090/mcp" style="width:100%;margin-bottom:4px;padding:4px;">
                <button onclick="addMCPServer()" style="width:100%;padding:4px;">连接</button>
            </div>
            <button onclick="toggleMCPForm()" style="margin-top:4px;width:100%;padding:4px;">+ 添加服务器</button>
        </div>
    </aside>

    <main id="chat-container">
        <header id="chat-header"><h1>Long Agent — 以交付为核心的 AI 助手</h1></header>
        <div id="chat-messages">
            <div class="message agent">
                <div class="avatar">🤖</div>
                <div class="content">
                    <p>你好！我是 Long Agent。</p>
                    <p>你可以试试：</p>
                    <ul>
                        <li>"记住我喜欢简洁风格" — 测试记忆写入</li>
                        <li>"查看我的记忆" — 测试记忆读取</li>
                    </ul>
                </div>
            </div>
        </div>
        <footer id="chat-input">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="输入消息... (Enter 发送)" rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">⬆️</button>
            </div>
        </footer>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
