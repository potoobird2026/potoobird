# Grafana Dashboard Provider — 自动加载 dashboards
apiVersion: 1

providers:
  - name: "Long Agent"
    orgId: 1
    folder: "Long Agent"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
